# Builds the downloadable SkipMan apps and publishes them as a GitHub Release.
#
# Releasing = bump __version__ in skipman/__init__.py (+ a CHANGELOG section)
# and push to master. If no release exists for that version yet, this builds
# the Mac + Windows apps, self-tests them, and publishes "vX.Y.Z".
# Every build runs SkipMan's self-test (real download + FFmpeg + tagging)
# before anything is published.

name: Release

on:
  push:
    branches: [master, "ci/**"]   # ci/* = test builds, never published
  workflow_dispatch:

permissions:
  contents: write

env:
  TEST_URL: https://soundcloud.com/bvrnout/drake-hotling-bling-bvrnoutremix

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('skipman/__init__.py').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/master ] && ! gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "New version v$VER: will build + release"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VER already released (or not master)"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true' || github.ref != 'refs/heads/master'
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac-arm64
            asset: SkipMan-mac-apple-silicon
            optional: false
          - os: macos-15-intel
            target: mac-x64
            asset: SkipMan-mac-intel
            optional: true
          - os: windows-latest
            target: windows
            asset: SkipMan-windows
            optional: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests
        shell: bash
        run: python -m pytest -q tests

      - name: Get FFmpeg
        shell: bash
        run: bash packaging/get_ffmpeg.sh ${{ matrix.target }}

      - name: Build app
        shell: bash
        run: |
          python packaging/make_icons.py
          pyinstaller --noconfirm --clean --distpath dist --workpath build/pyi packaging/SkipMan.spec

      - name: Self-test (Mac)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - dist/SkipMan.app
          export SKIPMAN_SELFTEST_LOG="$PWD/selftest.log"
          dist/SkipMan.app/Contents/MacOS/SkipMan --selftest "$TEST_URL" || (cat selftest.log; exit 1)
          cat selftest.log
          # Open the real window and make sure the interface loads
          SKIPMAN_SMOKE_LOG="$PWD/smoke.log" SKIPMAN_NO_UPDATE=1 dist/SkipMan.app/Contents/MacOS/SkipMan &
          pid=$!
          for i in $(seq 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat smoke.log && grep -q "UI OK" smoke.log

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SKIPMAN_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process dist\SkipMan\SkipMan.exe -ArgumentList "--selftest", $env:TEST_URL -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
          $env:SKIPMAN_SMOKE_LOG = "$PWD\smoke.log"
          $env:SKIPMAN_NO_UPDATE = "1"
          $w = Start-Process dist\SkipMan\SkipMan.exe -PassThru
          if (-not $w.WaitForExit(120000)) { $w.Kill() }
          Get-Content smoke.log
          if (-not (Select-String -Path smoke.log -Pattern "UI OK" -Quiet)) { exit 1 }

      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/SkipMan.app ${{ matrix.asset }}.zip

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\SkipMan -DestinationPath ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        run: |
          awk -v tag="## ${TAG}" 'index($0, tag)==1 {on=1; next} /^## v/ && on {exit} on' CHANGELOG.md > notes.md
          cat packaging/release-footer.md >> notes.md
          ls -la assets
          gh release create "$TAG" assets/*.zip --target "$GITHUB_SHA" \
            --title "SkipMan ${TAG}" --notes-file notes.md
